<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireMe AI</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:800px;
    background:#1e293b;
    border-radius:15px;
    padding:20px;
}

h1{
    text-align:center;
}

#chat{
    height:450px;
    overflow-y:auto;
    border:1px solid #334155;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.user{
    text-align:right;
    margin:10px 0;
}

.bot{
    text-align:left;
    margin:10px 0;
}

.msg{
    display:inline-block;
    padding:10px 14px;
    border-radius:10px;
    max-width:75%;
}

.user .msg{
    background:#2563eb;
}

.bot .msg{
    background:#334155;
}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>HireMe AI Assistant</h1>

<div id="chat"></div>

<div class="input-area">
    <input
        id="question"
        placeholder="Ask a question..."
        onkeydown="if(event.key==='Enter')sendMessage()"
    >
    <button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

const API_URL =
"https://hiremeai-backend-xhfw.onrender.com/chat";

function addMessage(text,type){

    const chat=document.getElementById("chat");

    const wrapper=document.createElement("div");
    wrapper.className=type;

    const bubble=document.createElement("div");
    bubble.className="msg";
    bubble.textContent=text;

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){

    const input=document.getElementById("question");

    const question=input.value.trim();

    if(!question) return;

    addMessage(question,"user");

    input.value="";

    try{

        const response=await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                question:question
            })
        });

        const data=await response.json();

        addMessage(
            data.answer || "No response received",
            "bot"
        );

    }catch(error){

        addMessage(
            "Backend connection failed.",
            "bot"
        );

        console.error(error);
    }
}
</script>

</body>
</html>
