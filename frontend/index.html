<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HireMe AI</title>

<style>

:root{
    --bg:#212121;
    --sidebar:#171717;
    --chat:#212121;
    --user:#2f2f2f;
    --assistant:#2a2a2a;
    --border:#3b3b3b;
    --text:#ececec;
    --muted:#a0a0a0;
    --green:#10a37f;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
}

.sidebar{
    width:260px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}

.logo{
    padding:24px;
    font-size:22px;
    font-weight:700;
}

.info{
    padding:20px;
}

.badge{
    display:inline-block;
    background:#0f3;
    color:black;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    margin-top:10px;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    height:60px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.status{
    color:var(--green);
    font-size:14px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 0;
}

.message{
    width:100%;
    padding:24px 0;
}

.message-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    gap:16px;
    padding:0 24px;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}

.user-avatar{
    background:#2563eb;
}

.bot-avatar{
    background:#10a37f;
}

.content{
    line-height:1.7;
    white-space:pre-wrap;
}

.user-message{
    background:var(--user);
}

.bot-message{
    background:var(--assistant);
}

.typing{
    display:none;
    max-width:900px;
    margin:auto;
    padding:0 24px 20px;
    color:var(--muted);
}

.input-area{
    border-top:1px solid var(--border);
    padding:20px;
}

.input-wrapper{
    max-width:900px;
    margin:auto;
    position:relative;
}

textarea{
    width:100%;
    resize:none;
    background:#2b2b2b;
    border:1px solid var(--border);
    color:white;
    border-radius:18px;
    padding:16px 60px 16px 18px;
    min-height:60px;
    outline:none;
}

.send{
    position:absolute;
    right:12px;
    bottom:12px;
    width:38px;
    height:38px;
    border:none;
    border-radius:10px;
    background:white;
    color:black;
    cursor:pointer;
    font-size:18px;
}

.send:hover{
    opacity:.9;
}

.footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding-top:10px;
}

@media(max-width:768px){

    .sidebar{
        display:none;
    }

    .message-inner{
        padding:0 16px;
    }
}

.fade{
    animation:fade .2s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="sidebar">

    <div class="logo">
        HireMe AI
    </div>

    <div class="info">
        <h3>Resume Assistant</h3>

        <p style="margin-top:10px;color:#aaa;">
            Ask anything about the candidate.
        </p>

        <div class="badge">
            ONLINE
        </div>
    </div>

</div>

<div class="main">

    <div class="header">

        <div>
            HireMe AI Assistant
        </div>

        <div id="status" class="status">
            ● Connecting...
        </div>

    </div>

    <div id="chat" class="chat"></div>

    <div id="typing" class="typing">
        AI is thinking...
    </div>

    <div class="input-area">

        <div class="input-wrapper">

            <textarea
                id="question"
                placeholder="Message HireMe AI..."
            ></textarea>

            <button
                class="send"
                onclick="sendMessage()"
                id="sendBtn"
            >
                ↑
            </button>

            <div class="footer">
                Powered by FastAPI + Groq
            </div>

        </div>

    </div>

</div>

<script>

const API_BASE =
"https://hiremeai-backend-xhfw.onrender.com";

const CHAT_API =
`${API_BASE}/chat`;

const chat =
document.getElementById("chat");

function addMessage(text,type){

    const wrapper =
    document.createElement("div");

    wrapper.className =
    `message fade ${
        type==="user"
        ? "user-message"
        : "bot-message"
    }`;

    const avatar =
    type==="user"
    ? "👤"
    : "🤖";

    wrapper.innerHTML = `
    <div class="message-inner">

        <div class="avatar ${
            type==="user"
            ? "user-avatar"
            : "bot-avatar"
        }">
            ${avatar}
        </div>

        <div class="content">
            ${escapeHtml(text)}
        </div>

    </div>
    `;

    chat.appendChild(wrapper);

    chat.scrollTop =
    chat.scrollHeight;
}

function escapeHtml(text){

    return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

async function checkBackend(){

    try{

        const response =
        await fetch(API_BASE);

        if(response.ok){

            document
            .getElementById("status")
            .innerHTML =
            "● Online";
        }

    }catch{

        document
        .getElementById("status")
        .style.color =
        "#ef4444";

        document
        .getElementById("status")
        .innerHTML =
        "● Offline";
    }
}

async function sendMessage(){

    const input =
    document.getElementById("question");

    const question =
    input.value.trim();

    if(!question) return;

    addMessage(question,"user");

    input.value="";

    document
    .getElementById("typing")
    .style.display="block";

    const btn =
    document.getElementById("sendBtn");

    btn.disabled=true;

    try{

        const response =
        await fetch(CHAT_API,{

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
                question
            })

        });

        const data =
        await response.json();

        document
        .getElementById("typing")
        .style.display="none";

        addMessage(
            data.answer ||
            "No response received.",
            "bot"
        );

    }catch(error){

        document
        .getElementById("typing")
        .style.display="none";

        addMessage(
            "Unable to connect to backend.",
            "bot"
        );

        console.error(error);
    }

    btn.disabled=false;
}

document
.getElementById("question")
.addEventListener("keydown",e=>{

    if(
        e.key==="Enter"
        &&
        !e.shiftKey
    ){

        e.preventDefault();

        sendMessage();
    }
});

window.onload=()=>{

    checkBackend();

    addMessage(
        "Hello! I'm HireMe AI. Ask me anything about the candidate.",
        "bot"
    );
};

</script>

</body>
</html>
