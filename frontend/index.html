<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subhajit AI Assistant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    height:90vh;
    background:rgba(15,23,42,.8);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.header{
    padding:20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    color:white;
    font-size:22px;
}

.status{
    color:#10b981;
    font-size:14px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    margin-bottom:16px;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:75%;
    padding:14px;
    border-radius:18px;
    line-height:1.5;
    white-space:pre-wrap;
}

.user .bubble{
    background:#2563eb;
    color:white;
}

.bot .bubble{
    background:#1e293b;
    color:#e2e8f0;
    border:1px solid rgba(255,255,255,.06);
}

.time{
    font-size:10px;
    margin-top:8px;
    opacity:.7;
}

.typing{
    padding:0 20px 10px;
    color:#94a3b8;
    display:none;
}

.input-area{
    padding:20px;
    border-top:1px solid rgba(255,255,255,.08);
    display:flex;
    gap:10px;
}

input{
    flex:1;
    background:#0f172a;
    color:white;
    border:1px solid #334155;
    border-radius:14px;
    padding:14px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:14px;
    padding:14px 24px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:700px){

    .container{
        height:100vh;
        border-radius:0;
    }

    .bubble{
        max-width:90%;
    }

    .header h1{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🤖 HireMe AI Assistant</h1>
        <div class="status" id="status">
            ● Connecting...
        </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="typing" id="typing">
        AI is thinking...
    </div>

    <div class="input-area">
        <input
            id="question"
            placeholder="Ask about skills, projects, experience..."
        >
        <button id="sendBtn" onclick="sendMessage()">
            Send
        </button>
    </div>

</div>

<script>

const API_BASE =
"https://hiremeai-backend-xhfw.onrender.com";

const CHAT_API =
`${API_BASE}/chat`;

async function checkHealth(){

    try{

        const response = await fetch(API_BASE);

        if(response.ok){

            document.getElementById("status").innerHTML =
            "● Connected";

            document.getElementById("status").style.color =
            "#10b981";
        }

    }catch{

        document.getElementById("status").innerHTML =
        "● Offline";

        document.getElementById("status").style.color =
        "#ef4444";
    }
}

function addMessage(text,type){

    const chat =
    document.getElementById("chat");

    const wrapper =
    document.createElement("div");

    wrapper.className =
    `message ${type}`;

    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";

    bubble.innerHTML =
    `${escapeHtml(text)}
    <div class="time">
    ${new Date().toLocaleTimeString()}
    </div>`;

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop =
    chat.scrollHeight;
}

function escapeHtml(text){

    return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

async function sendMessage(){

    const input =
    document.getElementById("question");

    const question =
    input.value.trim();

    if(!question) return;

    addMessage(question,"user");

    input.value="";

    document.getElementById("typing").style.display =
    "block";

    const btn =
    document.getElementById("sendBtn");

    btn.disabled = true;
    btn.innerText = "Thinking...";

    try{

        const response =
        await fetch(CHAT_API,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                question:question
            })
        });

        const data =
        await response.json();

        document.getElementById("typing").style.display =
        "none";

        addMessage(
            data.answer ||
            "No response received.",
            "bot"
        );

    }catch(error){

        document.getElementById("typing").style.display =
        "none";

        addMessage(
            "Unable to connect to backend.",
            "bot"
        );

        console.error(error);
    }

    btn.disabled = false;
    btn.innerText = "Send";
}

document
.getElementById("question")
.addEventListener("keydown",e=>{

    if(e.key==="Enter"){
        sendMessage();
    }
});

window.onload = ()=>{

    checkHealth();

    addMessage(
        "Hello! I am Subhajit's AI Resume Assistant. Ask me anything about the candidate.",
        "bot"
    );
};

</script>

</body>
</html>
